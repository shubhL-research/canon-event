<!-- The wall is wall.html and stays wall.html: it is named in the README, in
     DEMO.md, in the renderer test and in every heal ledger, and renaming a file
     so a host can find it is the host deciding the repository's vocabulary.

     This is the redirect a static host needs and nothing else. No build step, no
     router, and the folder still opens from a plain copy with wall.html
     double-clicked directly. The link below is not decoration: a meta refresh
     fails silently with JavaScript disabled or a strict referrer policy, and a
     page that silently fails to arrive is the failure this project is about. -->
<meta http-equiv="refresh" content="0; url=wall.html">
<link rel="canonical" href="wall.html">
